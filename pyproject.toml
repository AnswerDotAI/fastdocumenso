[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastdocumenso"
version = "0.1.2"
description = "Documenso v2 API client with pyskill for e-signature workflows"
requires-python = ">=3.10"
dependencies = ["fastcore", "fastspec>=0.1.3", "httpx", "pyskills>=0.0.27"]

[project.entry-points.pyskills]
"fastdocumenso.skill" = "fastdocumenso.skill"
[tool.setuptools.packages.find]
include = ["fastdocumenso"]
